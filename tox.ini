[tox]
envlist =
    py{310,311,312,313}-test{,-dev,-noviz,-viz,-viz_extra,-cov,-oldestdeps}
    build_docs
    codestyle
requires =
    setuptools >= 30.3.0
    pip >= 19.3.1
    tox-uv
set_env =
    casa: PIP_EXTRA_INDEX_URL = {env:PIP_EXTRA_INDEX_URL:https://casa-pip.nrao.edu/repository/pypi-group/simple}

[testenv]
passenv = HOME,DISPLAY,LC_ALL,LC_CTYPE,ON_TRAVIS
setenv =
    MPLBACKEND=Agg
    CASASITECONFIG={toxinidir}/.tmp/{envname}/config.py
    # uv does not read the pip-style PIP_EXTRA_INDEX_URL env var, so the
    # nightly-wheel indexes below were previously silently ignored and
    # astropy/numpy/pyerfa resolved to their released PyPI versions instead
    # of the intended dev builds. UV_INDEX is uv's native equivalent.
    dev: UV_INDEX = https://pypi.anaconda.org/liberfa/simple https://pypi.anaconda.org/astropy/simple https://pypi.anaconda.org/scientific-python-nightly-wheels/simple
    # uv's default index-strategy is "first-index", so it can stop at PyPI
    # (which also has released astropy/numpy/pyerfa) before ever consulting
    # the nightly-wheel indexes above. unsafe-best-match makes uv compare
    # versions across all indexes and pick the highest.
    dev: UV_INDEX_STRATEGY = unsafe-best-match
    # A specifier like astropy>=0.0.dev0 does not, on its own, make uv treat
    # pre-releases as eligible candidates (unlike pip); without this, uv
    # keeps resolving to the latest released version even when a newer dev
    # build is available on the indexes above.
    dev: UV_PRERELEASE = allow
changedir = .tmp/{envname}
description = run tests with pytest
uv_resolution =
    # The oldestdeps factor is intended to be used to install
    # the oldest versions of all dependencies
    oldestdeps: lowest-direct
deps =
    casa: numpy<2.0.0
    casa: scipy
    casa: matplotlib
    casa: casadata
    casa: casatools
    casa: casatasks
    dev: numpy>=0.0.dev0
    dev: pyerfa>=0.0.dev0
    dev: astropy>=0.0.dev0
extras =
    test
    dev: dev
    viz: viz
    viz_extra: viz_extra
    noviz: noviz
commands =
    casa: mkdir -p .casa/data
    casa: cp {toxinidir}/casa_config_template.py config.py
    casa: python -m casaconfig --update-all
    casa: python -m casaconfig --current-data
    {list_dependencies_command}
    !cov: pytest --pyargs spectral_cube {toxinidir}/docs {posargs}
    cov: pytest --pyargs spectral_cube {toxinidir}/docs --cov spectral_cube --cov-config={toxinidir}/pyproject.toml {posargs}
    cov: coverage xml -o {toxinidir}/coverage.xml
allowlist_externals =
    mkdir
    cp

[testenv:build_docs]
changedir =
    docs
description =
    invoke sphinx-build to build the HTML docs
extras =
    docs
commands =
    sphinx-build -W -b html . _build/html {posargs}

[testenv:codestyle]
deps = flake8
skip_install = true
commands =
    flake8 --max-line-length=100 spectral_cube
